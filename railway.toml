[build]
# Install all workspace dependencies, build libs, the frontend, and the API server
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build"

[deploy]
# The API server serves the pre-built frontend in production
startCommand = "node scripts/royal-start.mjs"
healthcheckPath = "/api/content"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
